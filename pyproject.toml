[project]
name = "hardware-store-domain-model"
version = "0.1.0"
description = "用领域模型约束 Agent：五金商城订单售后示例"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
agent = ["anthropic"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardware_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
